<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/main.css">
    <title>Iniciar Sesión</title>
</head>
<body>
    <main>
        <section aria-labelledby="login-title">
            <div class="container__logo__cenfo"></div>
            <div class="container__form">
                <h1 id="login-title">Iniciar sesión</h1>
                <form action="/login" method="post">
                    <div class="form-field">
                        <label for="email">
                            Correo electrónico
                        </label>
                        <input 
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="username"
                        required
                        >
                    </div>

                    <div class="form-field">
                        <label for="password">
                            Contraseña
                        </label>
                        <input 
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        required
                        >
                        <button type="button" id="btn-toggle">
                            <img src="../img/open-eye.svg" id="password-eye" alt="Mostrar/Ocultar contraseña">
                        </button>
                    </div>

                    <button type="submit">
                        Iniciar Sesión
                    </button>
                    <button type="button" class="boton boton--secundario boton--bloque" disabled
                    title="Disponible en la entrega final (RF-001)">Continuar con Google</button>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
