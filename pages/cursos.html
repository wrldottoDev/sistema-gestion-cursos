<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cursos · Gestión de Cursos CENFOTEC</title>
  <link rel="stylesheet" href="../css/styles.css">
  <script src="../js/datos.js" defer></script>
  <script src="../js/validacion.js" defer></script>
  <script src="../js/cursos.js" defer></script>
</head>
<body>
  <header class="encabezado">
    <p class="marca">CENFOTEC · Gestión de Cursos</p>
    <nav class="menu" aria-label="Principal">
      <a href="usuarios.html" data-rol="Administrador">Usuarios</a>
      <a href="cursos.html" aria-current="page">Cursos</a>
    </nav>
    <p class="encabezado__usuario" id="usuario-actual"></p>
  </header>

  <main class="contenedor">
    <div class="barra-titulo">
      <h1>Cursos</h1>
      <a class="boton boton--primario" href="curso.html" data-rol="Director de Escuela">Nuevo curso</a>
    </div>

    <div id="aviso" class="aviso" role="status" hidden></div>

    <div class="tabla-contenedor">
      <table class="tabla">
        <caption class="solo-lector">Catálogo de cursos</caption>
        <thead>
          <tr>
            <th scope="col">Código</th>
            <th scope="col">Nombre</th>
            <th scope="col">Escuela</th>
            <th scope="col">Estado</th>
            <th scope="col">Última modificación</th>
            <th scope="col"><span class="solo-lector">Acciones</span></th>
          </tr>
        </thead>
        <tbody id="lista-cursos"></tbody>
      </table>
    </div>
    <p class="texto-secundario" id="sin-cursos" hidden>No hay cursos registrados todavía.</p>
  </main>

  <footer class="pie">Universidad CENFOTEC · Proyecto Integrador I · 2026</footer>
</body>
</html>
