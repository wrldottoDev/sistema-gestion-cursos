<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuarios · Gestión de Cursos CENFOTEC</title>
  <link rel="stylesheet" href="../css/styles.css">
  <script src="../js/datos.js" defer></script>
  <script src="../js/validacion.js" defer></script>
  <script src="../js/usuarios.js" defer></script>
</head>
<body>
  <header class="encabezado">
    <p class="marca">CENFOTEC · Gestión de Cursos</p>
    <nav class="menu" aria-label="Principal">
      <a href="inicio.html">Inicio</a>
      <a href="usuarios.html" data-rol="Administrador" aria-current="page">Usuarios</a>
      <a href="catalogos.html" data-rol="Administrador">Catálogos</a>
      <a href="cursos.html">Cursos</a>
    </nav>
    <p class="encabezado__usuario" id="usuario-actual"></p>
  </header>

  <main class="contenedor">
    <div class="barra-titulo">
      <h1>Usuarios</h1>
      <a class="boton boton--primario" href="usuario.html">Registrar usuario</a>
    </div>

    <div id="aviso" class="aviso" role="status" hidden></div>

    <form id="filtros-usuarios" class="filtros-usuarios" role="search">
      <div class="campo">
        <label for="buscar">Buscar por nombre, identificación o correo</label>
        <input id="buscar" name="buscar" type="search" autocomplete="off">
      </div>
      <div class="campo">
        <label for="filtroRol">Rol</label>
        <select id="filtroRol" name="filtroRol">
          <option value="">Todos</option>
        </select>
      </div>
      <button type="button" id="limpiar" class="boton boton--secundario">Limpiar</button>
    </form>

    <div class="tabla-contenedor">
      <table class="tabla tabla--usuarios">
        <caption class="solo-lector">Usuarios registrados</caption>
        <thead>
          <tr>
            <th scope="col">Nombre</th>
            <th scope="col">Identificación</th>
            <th scope="col">Correo institucional</th>
            <th scope="col">Rol</th>
            <th scope="col">Escuela</th>
            <th scope="col">Edad</th>
            <th scope="col"><span class="solo-lector">Acciones</span></th>
          </tr>
        </thead>
        <tbody id="lista-usuarios"></tbody>
      </table>
    </div>
    <p class="texto-secundario" id="sin-resultados" hidden>No hay usuarios que coincidan.</p>
  </main>

  <footer class="pie">Universidad CENFOTEC · Proyecto Integrador I · 2026</footer>
</body>
</html>
